name: proevira_mobile
description: App móvil offline-first para vigilancia epidemiológica en Jalisco.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.0.3
  fl_chart: ^0.69.0
  flutter_map: ^7.0.2
  flutter_local_notifications: ^17.2.3
  geolocator: ^12.0.0
  http: ^1.2.2
  latlong2: ^0.9.1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  uuid: ^4.5.0
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - pip_cache_backend:/root/.cache/pip
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
    command: >
      sh -c "pip install -r backend/requirements.txt &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: python:3.12-slim
    working_dir: /app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - pip_cache_web:/root/.cache/pip
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      WS_BASE_URL: ws://backend:8000/ws/alerts
      PROEVIRA_DEMO_MODE: "false"
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "pip install -r web/requirements.txt &&
             streamlit run web/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true"

volumes:
  pip_cache_backend:
  pip_cache_web:


name: Build VIRALES Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean local.properties for Linux CI
        run: rm -f mobile/android/local.properties

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=https://virales.onrender.com/api/v1
          --dart-define=WS_BASE_URL=wss://virales.onrender.com/ws/alerts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: virales-app-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
